blueprint:
  name: Astrion 面板自动布局
  description: >-
    和原版卡片设置一样：按类别勾选想出现在面板上的设备（每类可多选），
    面板自动按家里的房间（区域）分组显示，设备名沿用 HA 里的名称。
    同时把 灯/窗帘/音乐/空调 四个专属物理键自动绑到对应设备（可改为任意一台
    同步到面板的设备）。HA 重启后 / 每天凌晨 4 点 / 设备变动时自动刷新。
  domain: automation
  author: Astrion
  input:
    light_entities:
      name: 灯
      default: []
      selector:
        entity:
          filter:
            - domain: light
          multiple: true
    switch_entities:
      name: 开关/插座
      default: []
      selector:
        entity:
          filter:
            - domain: switch
          multiple: true
    climate_entities:
      name: 空调/温控
      default: []
      selector:
        entity:
          filter:
            - domain: climate
          multiple: true
    cover_entities:
      name: 窗帘
      default: []
      selector:
        entity:
          filter:
            - domain: cover
          multiple: true
    fan_entities:
      name: 风扇
      default: []
      selector:
        entity:
          filter:
            - domain: fan
          multiple: true
    media_entities:
      name: 媒体播放器
      default: []
      selector:
        entity:
          filter:
            - domain: media_player
          multiple: true
    remote_entities:
      name: 电视/机顶盒遥控
      default: []
      selector:
        entity:
          filter:
            - domain: remote
          multiple: true
    scene_entities:
      name: 场景
      default: []
      selector:
        entity:
          filter:
            - domain: scene
          multiple: true
    script_entities:
      name: 脚本
      default: []
      selector:
        entity:
          filter:
            - domain: script
          multiple: true
    weather_entities:
      name: 天气
      default: []
      selector:
        entity:
          filter:
            - domain: weather
          multiple: true
    humidifier_entities:
      name: 加湿器
      default: []
      selector:
        entity:
          filter:
            - domain: humidifier
          multiple: true
    water_heater_entities:
      name: 热水器
      default: []
      selector:
        entity:
          filter:
            - domain: water_heater
          multiple: true
    valve_entities:
      name: 阀门
      default: []
      selector:
        entity:
          filter:
            - domain: valve
          multiple: true
    vacuum_entities:
      name: 吸尘器
      default: []
      selector:
        entity:
          filter:
            - domain: vacuum
          multiple: true
    layout_entity:
      name: 面板布局实体
      description: 面板设备上的 Panel Layout（text.astrion_layout）
      selector:
        entity:
          filter:
            - domain: text
    light_key_device:
      name: 灯按键绑定的设备（可选）
      description: 默认绑到勾选的第一盏灯；也可指定同步到面板的任意一台设备
      selector:
        entity: {}
    cover_key_device:
      name: 窗帘按键绑定的设备（可选）
      description: 默认绑到勾选的第一台窗帘；也可指定任意一台设备
      selector:
        entity: {}
    media_key_device:
      name: 音乐按键绑定的设备（可选）
      description: 默认绑到勾选的第一台媒体播放器；也可指定任意一台设备
      selector:
        entity: {}
    climate_key_device:
      name: 空调按键绑定的设备（可选）
      description: 默认绑到勾选的第一台空调；也可指定任意一台设备
      selector:
        entity: {}
    key_bindings_entity:
      name: 面板按键绑定实体（可选）
      description: 面板设备上的 Key Bindings（text.astrion_key_bindings）。选择后才会下发上面的按键绑定
      default: []
      selector:
        entity:
          filter:
            - domain: text
    custom_key_bindings:
      name: 自定义按键绑定（可选，优先于上面全部）
      description: 一行式，如 `134=light.a; 135=cover.b; 96=voice`。填写后忽略上方按键设置
      default: ""
      selector:
        text:
          multiline: false

triggers:
  - trigger: homeassistant
    event: start
  - trigger: time
    at: "04:00:00"
  - trigger: event
    event_type: entity_registry_updated

variables:
  light_entities: !input light_entities
  switch_entities: !input switch_entities
  climate_entities: !input climate_entities
  cover_entities: !input cover_entities
  fan_entities: !input fan_entities
  media_entities: !input media_entities
  remote_entities: !input remote_entities
  scene_entities: !input scene_entities
  script_entities: !input script_entities
  weather_entities: !input weather_entities
  humidifier_entities: !input humidifier_entities
  water_heater_entities: !input water_heater_entities
  valve_entities: !input valve_entities
  vacuum_entities: !input vacuum_entities
  layout_entity: !input layout_entity
  key_bindings_entity: !input key_bindings_entity
  custom_key_bindings: !input custom_key_bindings
  light_key_device: !input light_key_device
  cover_key_device: !input cover_key_device
  media_key_device: !input media_key_device
  climate_key_device: !input climate_key_device
  attribute_map:
    climate:
      - temperature
      - current_temperature
      - fan_mode
      - preset_mode
      - min_temp
      - max_temp
      - target_temp_low
      - target_temp_high
      - preset_modes
      - fan_modes
    light:
      - brightness
      - color_temp_kelvin
      - min_color_temp_kelvin
      - max_color_temp_kelvin
      - effect_list
      - supported_color_modes
      - effect
    fan:
      - percentage
    cover:
      - current_position
      - current_tilt_position
    media_player:
      - volume_level
      - media_position
      - media_duration
      - media_title
      - media_artist
      - source
      - source_list
      - sound_mode
      - sound_mode_list
  all_entities: >-
    {{ (light_entities or []) + (switch_entities or []) + (climate_entities or [])
       + (cover_entities or []) + (fan_entities or []) + (media_entities or [])
       + (remote_entities or []) + (scene_entities or []) + (script_entities or [])
       + (weather_entities or []) + (humidifier_entities or []) + (water_heater_entities or [])
       + (valve_entities or []) + (vacuum_entities or []) }}
  key_bindings_text: >-
    {% set ns = namespace(auto=[], manual=[]) %}
    {% for key, domain in [[134, 'light'], [135, 'cover'], [136, 'media_player'], [137, 'climate']] %}
      {% set es = all_entities | select('match', '^' ~ domain ~ '\\.') | list %}
      {% if es | count > 0 %}
        {% set ns.auto = ns.auto + [key ~ '=' ~ (es | first)] %}
      {% endif %}
    {% endfor %}
    {% if light_key_device %}
      {% set ns.manual = ns.manual + ['134=' ~ light_key_device] %}
    {% endif %}
    {% if cover_key_device %}
      {% set ns.manual = ns.manual + ['135=' ~ cover_key_device] %}
    {% endif %}
    {% if media_key_device %}
      {% set ns.manual = ns.manual + ['136=' ~ media_key_device] %}
    {% endif %}
    {% if climate_key_device %}
      {% set ns.manual = ns.manual + ['137=' ~ climate_key_device] %}
    {% endif %}
    {% set ns.merged = ns.auto %}
    {% for m in ns.manual %}
      {% set ns.merged = ns.merged | reject('match', '^' ~ (m.split('='))[0] ~ '=') | list %}
      {% set ns.merged = ns.merged + [m] %}
    {% endfor %}
    {% if custom_key_bindings and custom_key_bindings | length > 0 %}
      {{ custom_key_bindings }}
    {% else %}
      {{ ns.merged | join(';') }}
    {% endif %}
  layout_json: >-
    {% set ns = namespace(by_area={}, sync=[]) %}
    {% for e in all_entities %}
      {% if state_attr(e, 'entity_category') not in ['config', 'diagnostic'] %}
        {% set a = area_name(e) or '其他' %}
        {% set ns.by_area = dict(ns.by_area, **{a: ns.by_area.get(a, []) + [e]}) %}
        {% set ns.sync = ns.sync + [e] %}
        {% for at in attribute_map.get(e.split('.')[0], []) %}
          {% set ns.sync = ns.sync + [e ~ '.' ~ at] %}
        {% endfor %}
      {% endif %}
    {% endfor %}
    {% set ns.rooms = [] %}
    {% for a in ns.by_area %}
      {% set cards = namespace(items=[]) %}
      {% for e in ns.by_area[a] %}
        {% set cards.items = cards.items + [{'name': states[e].name if e in states else e, 'entities': [{'entity_id': e}]}] %}
      {% endfor %}
      {% set ns.rooms = ns.rooms + [{'title': a, 'cards': cards.items}] %}
    {% endfor %}
    {{ {'rooms': ns.rooms, 'sync_entities': ns.sync} | to_json }}

actions:
  - action: text.set_value
    target:
      entity_id: "{{ layout_entity }}"
    data:
      value: "{{ layout_json }}"
  - if: "{{ key_bindings_entity and key_bindings_text | length > 0 }}"
    then:
      - action: text.set_value
        target:
          entity_id: "{{ key_bindings_entity }}"
        data:
          value: "{{ key_bindings_text }}"

mode: single
