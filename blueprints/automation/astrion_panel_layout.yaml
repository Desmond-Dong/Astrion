blueprint:
  name: Astrion 面板自动布局（sensor attribute）
  description: >-
    和原版卡片设置一样：按类别勾选想出现在面板上的设备（每类可多选），
    面板自动按家里的房间（区域）分组显示，设备名沿用 HA 里的名称。

    原理：生成一个模板 sensor（sensor.astrion_layout），完整布局放在它的
    `layout` 属性里。HA 对实体状态限 255 字符、但属性不受限，所以布局
    不经过任何 text 实体、也不需要分块；勾选设备后 sensor 自动重算，
    面板订阅该属性实时刷新（无需自动化触发器、无需重启）。

    注意：HA 同一 unique_id 只能存在一个——用之前先停用/删除旧版蓝图的
    旧 text 实体，避免两个"布局实体"打架。
  domain: template
  author: Astrion
  input:
    light_entities:
      name: 灯
      default: []
      selector:
        entity:
          filter:
            - domain: light
          multiple: true
    switch_entities:
      name: 开关/插座
      default: []
      selector:
        entity:
          filter:
            - domain: switch
          multiple: true
    climate_entities:
      name: 空调/温控
      default: []
      selector:
        entity:
          filter:
            - domain: climate
          multiple: true
    cover_entities:
      name: 窗帘
      default: []
      selector:
        entity:
          filter:
            - domain: cover
          multiple: true
    fan_entities:
      name: 风扇
      default: []
      selector:
        entity:
          filter:
            - domain: fan
          multiple: true
    media_entities:
      name: 媒体播放器
      default: []
      selector:
        entity:
          filter:
            - domain: media_player
          multiple: true
    remote_entities:
      name: 电视/机顶盒遥控
      default: []
      selector:
        entity:
          filter:
            - domain: remote
          multiple: true
    scene_entities:
      name: 场景
      default: []
      selector:
        entity:
          filter:
            - domain: scene
          multiple: true
    script_entities:
      name: 脚本
      default: []
      selector:
        entity:
          filter:
            - domain: script
          multiple: true
    weather_entities:
      name: 天气
      default: []
      selector:
        entity:
          filter:
            - domain: weather
          multiple: true
    humidifier_entities:
      name: 加湿器
      default: []
      selector:
        entity:
          filter:
            - domain: humidifier
          multiple: true
    water_heater_entities:
      name: 热水器
      default: []
      selector:
        entity:
          filter:
            - domain: water_heater
          multiple: true
    valve_entities:
      name: 阀门
      default: []
      selector:
        entity:
          filter:
            - domain: valve
          multiple: true
    vacuum_entities:
      name: 吸尘器
      default: []
      selector:
        entity:
          filter:
            - domain: vacuum
          multiple: true
sensor:
  - name: Astrion Layout
    unique_id: astrion_layout
    icon: mdi:format-list-bulleted
    unit_of_measurement: " 台"
    variables:
      light_entities: !input light_entities
      switch_entities: !input switch_entities
      climate_entities: !input climate_entities
      cover_entities: !input cover_entities
      fan_entities: !input fan_entities
      media_entities: !input media_entities
      remote_entities: !input remote_entities
      scene_entities: !input scene_entities
      script_entities: !input script_entities
      weather_entities: !input weather_entities
      humidifier_entities: !input humidifier_entities
      water_heater_entities: !input water_heater_entities
      valve_entities: !input valve_entities
      vacuum_entities: !input vacuum_entities
    state: >-
      {{ ((light_entities or []) + (switch_entities or []) + (climate_entities or [])
          + (cover_entities or []) + (fan_entities or []) + (media_entities or [])
          + (remote_entities or []) + (scene_entities or []) + (script_entities or [])
          + (weather_entities or []) + (humidifier_entities or []) + (water_heater_entities or [])
          + (valve_entities or []) + (vacuum_entities or [])) | length }}
    attributes:
      layout: >-
        {% set ns = namespace(by_area={}) %}
        {% for e in (light_entities or []) + (switch_entities or []) + (climate_entities or [])
           + (cover_entities or []) + (fan_entities or []) + (media_entities or [])
           + (remote_entities or []) + (scene_entities or []) + (script_entities or [])
           + (weather_entities or []) + (humidifier_entities or []) + (water_heater_entities or [])
           + (valve_entities or []) + (vacuum_entities or []) %}
          {% if state_attr(e, 'entity_category') not in ['config', 'diagnostic'] %}
            {% set a = (area_name(area_id(e)) if area_id(e) else none) or '其他' %}
            {% set nm = (states[e].name if e in states else e)
               | replace('|', '/') | replace('=', '＝')
               | replace(',', '，') | replace(';', '；') %}
            {% set ns.by_area = dict(ns.by_area, **{a: ns.by_area.get(a, []) + [e ~ '|' ~ nm]}) %}
          {% endif %}
        {% endfor %}
        {% set ns.rows = [] %}
        {% for a in ns.by_area %}
          {% set ns.rows = ns.rows + [a ~ '=' ~ (ns.by_area[a] | join(', '))] %}
        {% endfor %}
        {{ ns.rows | join('; ') }}