blueprint:
  name: Astrion 面板自动布局
  description: >-
    和原版卡片设置一样：按类别勾选想出现在面板上的设备（每类可多选），
    面板自动按家里的房间（区域）分组显示，设备名沿用 HA 里的名称。
    HA 重启后 / 每天凌晨 4 点 / 家里设备变动时，布局自动刷新。
    物理按键绑定在遥控器上直接设置（下拉面板 → 快捷键绑定）。
  domain: automation
  author: Astrion
  input:
    light_entities:
      name: 灯
      default: []
      selector:
        entity:
          filter:
            - domain: light
          multiple: true
    switch_entities:
      name: 开关/插座
      default: []
      selector:
        entity:
          filter:
            - domain: switch
          multiple: true
    climate_entities:
      name: 空调/温控
      default: []
      selector:
        entity:
          filter:
            - domain: climate
          multiple: true
    cover_entities:
      name: 窗帘
      default: []
      selector:
        entity:
          filter:
            - domain: cover
          multiple: true
    fan_entities:
      name: 风扇
      default: []
      selector:
        entity:
          filter:
            - domain: fan
          multiple: true
    media_entities:
      name: 媒体播放器
      default: []
      selector:
        entity:
          filter:
            - domain: media_player
          multiple: true
    remote_entities:
      name: 电视/机顶盒遥控
      default: []
      selector:
        entity:
          filter:
            - domain: remote
          multiple: true
    scene_entities:
      name: 场景
      default: []
      selector:
        entity:
          filter:
            - domain: scene
          multiple: true
    script_entities:
      name: 脚本
      default: []
      selector:
        entity:
          filter:
            - domain: script
          multiple: true
    weather_entities:
      name: 天气
      default: []
      selector:
        entity:
          filter:
            - domain: weather
          multiple: true
    humidifier_entities:
      name: 加湿器
      default: []
      selector:
        entity:
          filter:
            - domain: humidifier
          multiple: true
    water_heater_entities:
      name: 热水器
      default: []
      selector:
        entity:
          filter:
            - domain: water_heater
          multiple: true
    valve_entities:
      name: 阀门
      default: []
      selector:
        entity:
          filter:
            - domain: valve
          multiple: true
    vacuum_entities:
      name: 吸尘器
      default: []
      selector:
        entity:
          filter:
            - domain: vacuum
          multiple: true
    layout_part_entities:
      name: 面板布局分片实体（Panel Layout 00–15）
      description: 面板设备上的 Panel Layout 00 到 Panel Layout 15，按 00→15 顺序全部勾选
      default: []
      selector:
        entity:
          filter:
            - domain: text
          multiple: true

triggers:
  - trigger: homeassistant
    event: start
  - trigger: time
    at: "04:00:00"
  - trigger: event
    event_type: entity_registry_updated

variables:
  layout_part_entities: !input layout_part_entities

actions:
  # 勾选的设备清单与布局 JSON 必须在动作序列里逐步求值：
  # 自动化顶层 variables 是整体渲染，同层变量互相不可见。
  - variables:
      light_entities: !input light_entities
      switch_entities: !input switch_entities
      climate_entities: !input climate_entities
      cover_entities: !input cover_entities
      fan_entities: !input fan_entities
      media_entities: !input media_entities
      remote_entities: !input remote_entities
      scene_entities: !input scene_entities
      script_entities: !input script_entities
      weather_entities: !input weather_entities
      humidifier_entities: !input humidifier_entities
      water_heater_entities: !input water_heater_entities
      valve_entities: !input valve_entities
      vacuum_entities: !input vacuum_entities
      attribute_map:
        climate:
          - temperature
          - current_temperature
          - fan_mode
          - preset_mode
          - min_temp
          - max_temp
          - target_temp_low
          - target_temp_high
          - preset_modes
          - fan_modes
        light:
          - brightness
          - color_temp_kelvin
          - min_color_temp_kelvin
          - max_color_temp_kelvin
          - effect_list
          - supported_color_modes
          - effect
        fan:
          - percentage
        cover:
          - current_position
          - current_tilt_position
        media_player:
          - volume_level
          - media_position
          - media_duration
          - media_title
          - media_artist
          - source
          - source_list
          - sound_mode
          - sound_mode_list
      all_entities: >-
        {{ (light_entities or []) + (switch_entities or []) + (climate_entities or [])
           + (cover_entities or []) + (fan_entities or []) + (media_entities or [])
           + (remote_entities or []) + (scene_entities or []) + (script_entities or [])
           + (weather_entities or []) + (humidifier_entities or []) + (water_heater_entities or [])
           + (valve_entities or []) + (vacuum_entities or []) }}
      layout_json: >-
        {% set ns = namespace(by_area={}, sync=[]) %}
        {% for e in all_entities %}
          {% if state_attr(e, 'entity_category') not in ['config', 'diagnostic'] %}
            {% set a = (area_name(area_id(e)) if area_id(e) else none) or '其他' %}
            {% set ns.by_area = dict(ns.by_area, **{a: ns.by_area.get(a, []) + [e]}) %}
            {% set ns.sync = ns.sync + [e] %}
            {% for at in attribute_map.get(e.split('.')[0], []) %}
              {% set ns.sync = ns.sync + [e ~ '.' ~ at] %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        {% set ns.rooms = [] %}
        {% for a in ns.by_area %}
          {% set cards = namespace(items=[]) %}
          {% for e in ns.by_area[a] %}
            {% set cards.items = cards.items + [{'name': states[e].name if e in states else e, 'entities': [{'entity_id': e}]}] %}
          {% endfor %}
          {% set ns.rooms = ns.rooms + [{'title': a, 'cards': cards.items}] %}
        {% endfor %}
        {{ {'rooms': ns.rooms, 'sync_entities': ns.sync} | to_json }}
  - if: "{{ all_entities | count > 0 and layout_part_entities | count == 16 }}"
    then:
      - repeat:
          for_each: "{{ layout_part_entities }}"
          sequence:
            - variables:
                part_index: "{{ repeat.index - 1 }}"
                part_value: "{{ layout_json[(part_index * 250):(part_index * 250 + 250)] }}"
            - action: text.set_value
              target:
                entity_id: "{{ repeat.item }}"
              data:
                value: "{{ part_value }}"

mode: single
