blueprint:
  name: Astrion 面板自动布局
  description: >-
    和原版卡片设置一样：按类别勾选想出现在面板上的设备（每类可多选），
    面板自动按家里的房间（区域）分组显示，设备名沿用 HA 里的名称。
    HA 重启后 / 每天凌晨 4 点 / 家里设备变动时，布局自动刷新。
    物理按键绑定在遥控器上直接设置（下拉面板 → 快捷键绑定）。
  domain: automation
  author: Astrion
  input:
    light_entities:
      name: 灯
      default: []
      selector:
        entity:
          filter:
            - domain: light
          multiple: true
    switch_entities:
      name: 开关/插座
      default: []
      selector:
        entity:
          filter:
            - domain: switch
          multiple: true
    climate_entities:
      name: 空调/温控
      default: []
      selector:
        entity:
          filter:
            - domain: climate
          multiple: true
    cover_entities:
      name: 窗帘
      default: []
      selector:
        entity:
          filter:
            - domain: cover
          multiple: true
    fan_entities:
      name: 风扇
      default: []
      selector:
        entity:
          filter:
            - domain: fan
          multiple: true
    media_entities:
      name: 媒体播放器
      default: []
      selector:
        entity:
          filter:
            - domain: media_player
          multiple: true
    remote_entities:
      name: 电视/机顶盒遥控
      default: []
      selector:
        entity:
          filter:
            - domain: remote
          multiple: true
    scene_entities:
      name: 场景
      default: []
      selector:
        entity:
          filter:
            - domain: scene
          multiple: true
    script_entities:
      name: 脚本
      default: []
      selector:
        entity:
          filter:
            - domain: script
          multiple: true
    weather_entities:
      name: 天气
      default: []
      selector:
        entity:
          filter:
            - domain: weather
          multiple: true
    humidifier_entities:
      name: 加湿器
      default: []
      selector:
        entity:
          filter:
            - domain: humidifier
          multiple: true
    water_heater_entities:
      name: 热水器
      default: []
      selector:
        entity:
          filter:
            - domain: water_heater
          multiple: true
    valve_entities:
      name: 阀门
      default: []
      selector:
        entity:
          filter:
            - domain: valve
          multiple: true
    vacuum_entities:
      name: 吸尘器
      default: []
      selector:
        entity:
          filter:
            - domain: vacuum
          multiple: true
    layout_entity:
      name: 面板布局实体
      description: 面板设备上的 Panel Layout（text.astrion_layout）
      selector:
        entity:
          filter:
            - domain: text

triggers:
  - trigger: homeassistant
    event: start
  - trigger: time
    at: "04:00:00"
  - trigger: event
    event_type: entity_registry_updated

variables:
  layout_entity: !input layout_entity

actions:
  # 勾选的设备清单与布局 JSON 必须在动作序列里逐步求值：
  # 自动化顶层 variables 是整体渲染，同层变量互相不可见。
  - variables:
      light_entities: !input light_entities
      switch_entities: !input switch_entities
      climate_entities: !input climate_entities
      cover_entities: !input cover_entities
      fan_entities: !input fan_entities
      media_entities: !input media_entities
      remote_entities: !input remote_entities
      scene_entities: !input scene_entities
      script_entities: !input script_entities
      weather_entities: !input weather_entities
      humidifier_entities: !input humidifier_entities
      water_heater_entities: !input water_heater_entities
      valve_entities: !input valve_entities
      vacuum_entities: !input vacuum_entities
      all_entities: >-
        {{ (light_entities or []) + (switch_entities or []) + (climate_entities or [])
           + (cover_entities or []) + (fan_entities or []) + (media_entities or [])
           + (remote_entities or []) + (scene_entities or []) + (script_entities or [])
           + (weather_entities or []) + (humidifier_entities or []) + (water_heater_entities or [])
           + (valve_entities or []) + (vacuum_entities or []) }}
      layout_text: >-
        {% set ns = namespace(by_area={}) %}
        {% for e in all_entities %}
          {% if state_attr(e, 'entity_category') not in ['config', 'diagnostic'] %}
            {% set a = (area_name(area_id(e)) if area_id(e) else none) or '其他' %}
            {% set nm = (states[e].name if e in states else e)
               | replace('|', '/') | replace('=', '＝')
               | replace(',', '，') | replace(';', '；') %}
            {% set ns.by_area = dict(ns.by_area, **{a: ns.by_area.get(a, []) + [e ~ '|' ~ nm]}) %}
          {% endif %}
        {% endfor %}
        {% set ns.rows = [] %}
        {% for a in ns.by_area %}
          {% set ns.rows = ns.rows + [a ~ '=' ~ (ns.by_area[a] | join(', '))] %}
        {% endfor %}
        {{ ns.rows | join('; ') }}
  - if: "{{ all_entities | count > 0 }}"
    then:
      # 面板的 text.astrion_layout 向 HA 声明 max_length=32768（协议本身无
      # 255 限制，HA 按声明值校验），整条布局一次写入即可，不存在截断。
      - action: text.set_value
        target:
          entity_id: "{{ layout_entity }}"
        data:
          value: "{{ layout_text }}"

mode: single
